services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geoguessr
      POSTGRES_USER: geoguessr
      POSTGRES_PASSWORD: geoguessr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoguessr -d geoguessr"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - geoguessr-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - geoguessr-network

  backend:
    build:
      context: .                          
      dockerfile: backend/Dockerfile      
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://geoguessr:geoguessr@db:5432/geoguessr
      DATABASE_URL: postgresql+psycopg2://geoguessr:geoguessr@db:5432/geoguessr
      REDIS_URL: redis://redis:6379/0    
      FLASK_DEBUG: "True"
    ports:
      - "8000:5000"                      
    networks:
      - geoguessr-network

  frontend:
    build:
      context: .                          
      dockerfile: frontend/Dockerfile     
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    environment:
      VITE_BACKEND_URL: "http://localhost:8000"         
      VITE_SOCKETIO_SERVER_URL: "http://localhost:8000" 
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    networks:
      - geoguessr-network

volumes:
  postgres_data:

networks:
  geoguessr-network:
    driver: bridge